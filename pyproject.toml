[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpp-repl"
version = "0.1.0"
description = "A C++ REPL on top of clang-repl: whole blocks, printed values, crash recovery, profiles for your libraries"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Nadim Farhat"}]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/farhatnadim/cpp_repl"
Repository = "https://github.com/farhatnadim/cpp_repl"
Issues = "https://github.com/farhatnadim/cpp_repl/issues"

[project.optional-dependencies]
ui = ["prompt_toolkit>=3.0", "pygments>=2.10"]
bench = ["numpy", "threadpoolctl", "matplotlib"]
test = ["pytest>=7"]

[project.scripts]
cpp-repl = "cpp_repl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpp_repl = ["prelude/*.h", "profiles/*/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "backend: needs a clang-repl binary (CPP_REPL_CLANG_REPL or one on PATH)",
]
