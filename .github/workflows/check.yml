# make check-docker on every pull request and on main: the test suite inside
# cpp-repl:llvm23, built here from src/cpp_repl/docker/Dockerfile, then claude plugin
# validate. The image is the environment the README documents the suite
# passing in: clang-repl 23 from apt.llvm.org, compiling against GCC 13 as on
# the author's machine. On the runner itself clang-23 picks GCC 14, and the
# tutorials' transcripts, which show libstdc++'s paths, differ.
#
# make check, the same suite against the host's clang-repl, is what AGENTS.md's
# "How changes land" asks for before a pull request. The job is named check
# because the ruleset on main requires a passing check of that name. A pull
# request also has to close an issue: the board is where work starts.
#
# The package job is the one-command install: the wheel built with uv,
# installed with uv tool, run from outside the checkout against clang-repl 23
# from apt.llvm.org on the runner, as a C++ developer installs cpp-repl.

name: check

on:
  pull_request:
    # edited: the base moved, as when the branch a pull request was stacked
    # on merged and GitHub retargeted it to main.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The pull request closes an issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub links the issue only once the pull request targets main; one
          # stacked on another branch is checked again when it does.
          if [ "${{ github.base_ref }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::notice::stacked on ${{ github.base_ref }}: the issue it closes is checked once it targets main"; exit 0
          fi
          n=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
                --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          test "$n" -gt 0 || { echo "::error::the pull request closes no issue: write 'Closes #N' in its description"; exit 1; }

      # claude plugin validate runs in Claude Code; the version pinned here is
      # the one make check last ran with on the author's machine.
      - name: Claude Code, for claude plugin validate
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: make check-docker
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: make check-docker

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.0

      - name: clang-repl 23 from apt.llvm.org
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-23 clang-tools-23

      - name: make wheel-check
        run: make wheel-check

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
