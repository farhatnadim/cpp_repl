# make check on every pull request and on main: what AGENTS.md's "How changes
# land" asks for before a pull request, run again where it counts. The job is
# named check because the ruleset on main requires a passing check of that name.
#
# A pull request also has to close an issue: the board is where work starts.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The pull request closes an issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
                --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          test "$n" -gt 0 || { echo "::error::the pull request closes no issue: write 'Closes #N' in its description"; exit 1; }

      # As docker/Dockerfile's apt stage: clang-repl 23 from apt.llvm.org, the
      # libraries the tests load (Eigen, glm, spdlog) and the Python packages.
      - name: clang-repl 23 from apt.llvm.org
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main" \
            | sudo tee /etc/apt/sources.list.d/apt.llvm.org.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-23 clang-tools-23 libc++-23-dev libc++abi-23-dev \
            libeigen3-dev libglm-dev libspdlog-dev \
            python3-pytest python3-prompt-toolkit python3-pygments
          /usr/lib/llvm-23/bin/clang-repl --version

      # claude plugin validate runs in Claude Code; the version pinned here is
      # the one make check last ran with on the author's machine.
      - name: Claude Code, for claude plugin validate
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: make check
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: make check CLANG_REPL=/usr/lib/llvm-23/bin/clang-repl
