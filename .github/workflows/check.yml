# make check-docker on every pull request and on main: the test suite inside
# cpp-repl:llvm23, built here from docker/Dockerfile, then claude plugin
# validate. The image is the environment the README documents the suite
# passing in: clang-repl 23 from apt.llvm.org, compiling against GCC 13 as on
# the author's machine. On the runner itself clang-23 picks GCC 14, and the
# tutorials' transcripts, which show libstdc++'s paths, differ.
#
# make check, the same suite against the host's clang-repl, is what AGENTS.md's
# "How changes land" asks for before a pull request. The job is named check
# because the ruleset on main requires a passing check of that name. A pull
# request also has to close an issue: the board is where work starts.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The pull request closes an issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
                --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          test "$n" -gt 0 || { echo "::error::the pull request closes no issue: write 'Closes #N' in its description"; exit 1; }

      # claude plugin validate runs in Claude Code; the version pinned here is
      # the one make check last ran with on the author's machine.
      - name: Claude Code, for claude plugin validate
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: make check-docker
        env:
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: make check-docker
